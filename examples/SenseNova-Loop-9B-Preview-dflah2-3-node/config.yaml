# Three 8-GPU nodes: one FSDP trainer, two independent TP=8 SenseNova Loop targets.
# Existing-answer supervision with V2 direct hidden-state capture.
model:
  target_model_path: ${oc.env:TARGET_MODEL_PATH,/mnt/afs_agents/yankuihao/model_ckpts/SenseNova-6.8-Loop-9B-Preview-mtp13200}
  target_model_backend: vllm
  draft_model_config: configs/draft_models/sensenova_loop_dflash2.json
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  norm_key: model.language_model.norm.weight
  trust_remote_code: true

dataset:
  train_data_path: ../data/sample_sensenova_loop_text.jsonl
  renderer: sensenova-loop
  prompt_key: conversations
  last_turn_loss_only: true
  shuffle_dataset: true
  length_group_size: 1
  min_loss_tokens: 16

training:
  load_path: null
  ckpt_step: null
  continual_training: false
  attention_backend: flex_attention
  fsdp_strategy: FULL_SHARD
  gradient_checkpointing: true
  micro_batch_size: 1
  draft_accumulation_steps: 4
  learning_rate: 1e-4
  max_concurrent_batches: 1
  max_grad_norm: 0.5
  max_seq_length: 131072
  num_epochs: 1
  prefetch_depth: 1
  save_interval: 500
  save_per_epoch: true
  max_checkpoints: 2
  seed: 42
  train_with_decode: false
  training_num_gpus_per_node: 8
  training_num_nodes: 1
  distributed_timeout_minutes: 60
  ttt_length: 7
  warmup_ratio: 0.0
  dflash_block_size: 8
  dflash_num_anchors: 512
  dflash_num_target_layers: 5
  dflash_loss_decay_gamma: 7.0
  dflash_ce_loss_alpha: 1.0
  dflash_l1_loss_alpha: 0.0
  dflash2_selector_loss_alpha: 1.0

inference:
  inference_engine_type: vllm
  inference_num_gpus: 16
  inference_num_gpus_per_engine: 8
  inference_num_gpus_per_node: 8
  inference_batch_size: 1
  inference_buffer_threshold: 8
  inference_fetch_batch: 2
  # A dispatch needs eight samples (8 training ranks x microbatch 1).
  max_sample_pool_size: 64
  # CE + selector does not consume final states; direct capture still publishes
  # the independent post-norm final slot (56).
  store_last_hidden_states: false
  last_hidden_states_prenorm: false
  aux_hidden_states_layers: [3, 27, 51, 53, 54]
  vllm:
    nnodes: 1
    tp_size: 8
    pp_size: 1
    init_timeout: 1800
    dist_timeout: 1800
    mem_fraction_static: 0.80
    direct_hidden_state_capture: true
    enable_multimodal: false
    extra_args:
      dtype: bfloat16
      enforce_eager: true
      language_model_only: true
      limit_mm_per_prompt: {image: 4, video: 0}
      mm_processor_kwargs: {max_pixels: 1048576}
      mamba_ssm_cache_dtype: float32
      max_model_len: 131072
      max_num_batched_tokens: 8192
      max_num_seqs: 1
      enable_chunked_prefill: true

decode:
  target_only: false
  # Prefill capture reserves one internal token; it is not a training answer.
  max_new_tokens: 1
  min_new_tokens: 1
  speculative_algorithm: null
  speculative_draft_model_path: null
  weight_sync_enabled: false
  weight_sync_interval: 0

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  # Per inference producer, not the aggregate capacity of the two replicas.
  # Four accumulation dispatches can queue 32 x ~6 GiB at full context.
  global_segment_size: 512GB
  local_buffer_size: 16GB
  host_buffer_size: 10GB

output_dir: ./outputs/SenseNova-Loop-9B-Preview-dflah2-3-node
cache_dir: ./cache/SenseNova-Loop-9B-Preview-dflah2-3-node
model_download_dir: null

logging:
  report_to: none

debug:
  enable_perf_metrics: true
