[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensespec"
dynamic = ["version"]
description = "DSpark and DFlash2 draft-model training with vLLM, FSDP, and Mooncake"
readme = "README.md"
# The distribution includes TorchSpec code with retained MIT notices.
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "setuptools",
    "tqdm",
    "wandb",
    "qwen-vl-utils",
    "psutil",
    "numpy<2.4",
    "accelerate",
    "pydantic",
    "openai-harmony",
    "cmake",
    "ninja",
    "packaging",
    "pyzmq",
    "mooncake-transfer-engine>=0.3.10.post1",
    "openai",
    "omegaconf",
    "ray",
    "numba",
]

[tool.setuptools.packages.find]
include = ["sensespec*"]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

vllm = [
    "vllm>=0.18.0",
]

trtllm = [
    "tensorrt-llm>=1.3.0rc18",
]

fa = [
    "flash-attn-4>=4.0.0b7",
    "nvidia-cutlass-dsl>=4.4.2",
    "nvidia-cutlass-dsl-libs-base>=4.4.2",
]

full-data = [
    "matplotlib",
    "tensorboard",
    "requests",
    "pillow",
]


[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "TID252"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["sensespec"]
known-third-party = ["wandb"]
